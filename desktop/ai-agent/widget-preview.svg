<svg xmlns="http://www.w3.org/2000/svg" width="1366" height="768" viewBox="0 0 1366 768" role="img" aria-labelledby="title description">
  <!-- Static visual preview of the widget layout from widget_ui.py. -->
  <title id="title">VEDA floating desktop widget preview</title>
  <desc id="description">A preview of the 280 by 90 pixel Nexus widget floating near the upper-left corner of a desktop.</desc>
  <defs>
    <linearGradient id="desktop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#172033"/>
      <stop offset="1" stop-color="#090d16"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity=".55"/>
    </filter>
  </defs>
  <rect width="1366" height="768" fill="url(#desktop)"/>
  <text x="34" y="34" fill="#718096" font-family="Segoe UI, sans-serif" font-size="12" letter-spacing="2">DESKTOP WIDGET PREVIEW</text>
  <g transform="translate(50 50)" filter="url(#shadow)">
    <rect width="280" height="90" rx="15" fill="#0a0a0a" stroke="#d4af37" stroke-width="2"/>
    <circle cx="23" cy="22" r="6" fill="#2ecc71"/>
    <text x="39" y="25" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700">NEXUS HYBRID</text>
    <text x="15" y="54" fill="#a0a0a0" font-family="Consolas, monospace" font-size="10">Ready | Say 'Nexus'</text>
    <rect x="190" y="10" width="70" height="26" rx="8" fill="#1e3f20"/>
    <text x="225" y="27" text-anchor="middle" fill="#d4af37" font-family="Segoe UI, sans-serif" font-size="10" font-weight="700">MIC  Tap</text>
    <text x="252" y="68" text-anchor="middle" fill="#888888" font-family="Arial, sans-serif" font-size="17">×</text>
  </g>
  <text x="50" y="170" fill="#718096" font-family="Segoe UI, sans-serif" font-size="12">Floating, draggable, always-on-top panel • screen capture disabled</text>
</svg>
